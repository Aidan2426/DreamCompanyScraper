name: Daily Job Scrape

on:
  schedule:
    - cron: "45 3 * * *"  # 11:45pm EDT (UTC-4)
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore jobs.db cache
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      # The Actions cache is evicted after 7 days unused, which would lose all job
      # history. Fall back to the copy uploaded to the db-backup release each run.
      - name: Restore jobs.db from backup release
        if: hashFiles('jobs.db') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download db-backup --pattern jobs.db || echo "No backup release yet"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Scrape jobs
        run: python main.py

      - name: Build index.html
        run: |
          python build.py --no-open
          mkdir -p dist
          cp index.html dist/
          cp -r archive dist/

      - name: Back up jobs.db
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view db-backup >/dev/null 2>&1; then
            gh release create db-backup --title "jobs.db backup" --latest=false \
              --notes "Latest jobs.db, re-uploaded by every daily scrape."
          fi
          gh release upload db-backup jobs.db --clobber

      - name: Commit updated city coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add city_coords.json
          git diff --cached --quiet || git commit -m "chore: update city_coords.json [skip ci]"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Only keep the latest deploy; daily multi-MB snapshots would bloat the repo.
          force_orphan: true
